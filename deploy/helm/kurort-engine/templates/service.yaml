apiVersion: v1
kind: Service
metadata:
  name: {{ include "kurort.fullname" . }}
  labels:
    {{- include "kurort.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "kurort.selectorLabels" . | nindent 4 }}
