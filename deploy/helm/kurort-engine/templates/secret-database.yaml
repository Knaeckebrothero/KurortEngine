{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kurort.fullname" . }}-database
  labels:
    {{- include "kurort.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.externalDatabase.url | quote }}
{{- end }}
