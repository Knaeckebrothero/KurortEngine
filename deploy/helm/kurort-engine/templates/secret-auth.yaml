{{- if .Values.auth.enabled }}
{{- $name := include "kurort.auth.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "session-secret") }}
{{- $session = index $existing.data "session-secret" | b64dec }}
{{- else }}
{{- $session = randAlphaNum 64 }}
{{- end }}
{{- if or (not .Values.auth.session.existingSecret) .Values.auth.oidc.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kurort.labels" . | nindent 4 }}
  annotations:
    # Rotating the session key logs every user out; keep it across upgrades.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if not .Values.auth.session.existingSecret }}
  session-secret: {{ $session | quote }}
  {{- end }}
  {{- with .Values.auth.oidc.clientSecret }}
  client-secret: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
