# KurortEngine Helm values. See docs/ops/kubernetes.md for the full reference.

image:
  repository: localhost/kurort-engine
  tag: dev
  # k3d imports images straight into containerd, so never try to pull them.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Migrations run in an init container of every pod. Keep one replica, or move
# `kurort-app migrate` into a Job before scaling out.
replicaCount: 1

app:
  hotelName: "Hotel Rheinland"
  hotelCity: "Bad Orb"
  # Pin the business date (YYYY-MM-DD) for a reproducible demo; empty = real date.
  today: ""
  # Extra environment variables for the app container ({NAME: value}).
  extraEnv: {}

demo:
  # Demo data loaded by an init container on every pod start:
  #   if-empty  seed only an empty database (default)
  #   reset     wipe front-desk data and reseed on every start (demo mornings)
  #   off       never seed (production)
  seed: if-empty

# Command bar planner. rules = built-in German phrase rules (no key, no cost);
# claude = Claude via the Anthropic API, with the rules answering whenever the
# API is slow or unreachable. The pod then needs outbound HTTPS to api.anthropic.com.
assistant:
  engine: rules
  model: claude-opus-5-5
  # Secret holding the Anthropic API key (required for engine=claude).
  existingSecret: ""
  existingSecretKey: api-key

# Staff login via OpenID Connect — Keycloak or any OIDC provider. The app
# only needs an issuer, a confidential client and a `roles` claim carrying
# `rezeption`, `leitung`, `housekeeping` or `kueche`
# (docs/ops/kubernetes.md#authentication).
# enabled=false runs the app without login (KURORT_AUTH=off): local use only.
auth:
  enabled: true
  # Browser-facing base URL of the app; the client's redirect URI is
  # <publicUrl>/auth/callback. Empty = http(s)://<ingress.host>.
  publicUrl: ""
  oidc:
    # Public issuer as it appears in tokens, e.g.
    # https://login.example.de/realms/hotel-rheinland
    issuer: ""
    # Base the app uses server-side for discovery, token and JWKS calls, when
    # the pod cannot reach the public issuer URL. Empty = issuer.
    internalUrl: ""
    clientId: kurort-app
    # Either a literal secret (stored in Secret <fullname>-auth) ...
    clientSecret: ""
    # ... or an existing Secret holding it.
    existingSecret: ""
    existingSecretKey: client-secret
  # Key that signs the session cookie. Empty existingSecret = generate once
  # into Secret <fullname>-auth and keep it across upgrades.
  session:
    existingSecret: ""
    existingSecretKey: session-secret

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: kurort.localhost
  annotations: {}
  # tls:
  #   - secretName: kurort-tls
  #     hosts: [kurort.example.de]
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 160Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

# Bundled single-instance Postgres for local and demo use. For production,
# disable it and point externalDatabase at a managed or CNPG database.
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  auth:
    username: kurort
    database: kurort
    # Empty = generate once on install and keep it across upgrades.
    password: ""
  persistence:
    size: 2Gi
    # Empty = the cluster's default StorageClass (local-path on k3d).
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Used when postgresql.enabled=false. Either reference an existing Secret
# (a CNPG cluster's `<cluster>-app` Secret has the URL under key `uri`) or
# give a URL and let the chart create the Secret.
externalDatabase:
  existingSecret: ""
  existingSecretKey: uri
  url: ""
