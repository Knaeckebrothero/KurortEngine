{{- $fullname := include "kc.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $adminPassword := .Values.admin.password | default (include "kc.keep" (dict "ns" $ns "name" $fullname "key" "admin-password" "fallback" (randAlphaNum 24))) }}
{{- $dbPassword := include "kc.keep" (dict "ns" $ns "name" $fullname "key" "db-password" "fallback" (randAlphaNum 32)) }}
{{- $clientSecretName := printf "%s-kurort-app-client" $fullname }}
{{- $clientSecret := .Values.client.secret | default (include "kc.keep" (dict "ns" $ns "name" $clientSecretName "key" "client-secret" "fallback" (randAlphaNum 40))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-username: {{ .Values.admin.username | quote }}
  admin-password: {{ $adminPassword | quote }}
  db-password: {{ $dbPassword | quote }}
  demo-password: {{ .Values.demoPassword | quote }}
---
# Shared with the app release (auth.oidc.existingSecret in values-k3d.yaml):
# one source of truth for the kurort-app client secret. Dev-only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientSecretName }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  client-id: {{ .Values.client.clientId | quote }}
  client-secret: {{ $clientSecret | quote }}
