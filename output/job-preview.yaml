apiVersion: srw/v1alpha1
kind: Job
metadata:
  name: job-using-srw-development
  namespace: srw
  labels:
    srw.io/workspace-template: srw-development
    srw.io/owner: test
    srw.io/acceptance: '2026-09-10'
spec:
  workspaceTemplateRef:
    name: srw-development
  resources:
    cpu: 12
    memory: 24Gi
    storage: 120Gi
  environment:
    image: ghcr.io/knaeckebrothero/superhuman-remote-worker-agent-vm-base@sha256:db1015a32173c4553d1ad432bdb48760fdb8ba0782d25ae20349d4aaaf26c28f
    pullPolicy: IfNotPresent
    cache: Reuse
  command:
  - bash
  - -lc
  - echo 'job references workspace-template srw-development'; exit 0
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  restartPolicy: Never
