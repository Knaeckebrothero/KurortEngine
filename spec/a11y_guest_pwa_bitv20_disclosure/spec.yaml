# -----------------------------------------------------------------------------
# Notes for the green phase (not part of AC, just guidance for the implementer)
# -----------------------------------------------------------------------------
implementation_notes:
  - >-
    `bitv20.py` should follow the `wcag_aa.py + self_attest.py` 3-module
    pattern (pinned memory [1]): top-level constant `BITV20_TS_ISO8601`
    (and helper `_BITV20_TS`), constant `BITV20_DISCLOSURE_VERSION`
    (and helper `_DISCLOSURE_VERSION`), function
    `get_bitv20_conformance_statement`, function
    `render_bitv20_disclosure_pdf`, function
    `apply_bitv20_footer_to_pdf`. No subprocess. No axe-core.
    No audit-log append (the existing
    `_append_wcag_aa_audit()` already records the WCAG 2.1 AA audit
    infrastructure run; BITV 2.0 is the publication step, not a
    second audit run).
  - >-
    `render_bitv20_disclosure_pdf` follows the existing meldeschein
    byte-blob pattern (hand-crafted `b"%PDF-1.4\n"` header — verified
    via grep: no `canvas.Canvas` usage anywhere in `repo/src/`).
    Using `canvas.Canvas` would technically be available
    (`reportlab>=4.0,<6.0` is in `pyproject.toml` deps), but the
    byte-blob pattern is the safer route for a Stage-2 minimum PDF
    that satisfies AC-3 first-byte + body-substring + marker oracles.
  - >-
    `apply_bitv20_footer_to_pdf` does NOT decompose / re-encode the
    existing PDF (high risk + no pdf-lib in deps). Instead it appends
    a `%% BITV20-footer: <text>` comment block at the end of the raw
    PDF byte stream, BEFORE any `%%EOF` marker. PDF readers tolerate
    trailing comment blocks. The `b"%PDF-"` prefix is preserved because
    we never rewrite the prefix segment. Returns NEW bytes (does not
    mutate input).
  - >-
    BITV 2.0 section headings in AC-2 are listed in canonical order
    (matching BFSG Art. 3 Abs. 1 + Anlage 2) so downstream parsers
    can rely on order. The exact 5 headings:
    "Geltungsbereich", "Stand der Vereinbarkeit",
    "Nicht barrierefreie Inhalte", "Erstellung dieser Erklärung",
    "Feedback-Mechanismus".
