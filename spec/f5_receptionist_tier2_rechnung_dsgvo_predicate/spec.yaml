# -----------------------------------------------------------------------------
# intent — one-sentence purpose of the feature
# -----------------------------------------------------------------------------
intent: >-
  Wire 3 SHIPPED library modules (rechnung.py / kurgaste_retention.auto_cascade
  / predicate_filing) onto `__main__.py` argparse subparsers and
  `__init__.py:parse_subcommand` dispatcher so the receptionist-facing CLI
  exposes 7 subcommands (4 Tier-1 + 3 Tier-2) for meldeschein, kurtaxe,
  remittance, arrival, rechnung, dsgvo, predicate — closing the F5 qa-finding
  that 3 Tier-2 subcommands remain missing despite their library modules
  being SHIPPED.

# -----------------------------------------------------------------------------
# acceptance_criteria — 3 EARS ACs (one per Tier-2 subcommand)
# -----------------------------------------------------------------------------
acceptance_criteria:
  - id: AC-1
    ears: "When the user invokes `python -m kurort_engine rechnung issue` with a valid JSON payload supplied either via stdin or via `--input-file <path.json>`, the system shall parse monetary fields as `Decimal(string_value)` (no raw float), validate the payload schema, and emit a GoBD §10 retention-compliant text-only output on stdout; and the system shall exit 0 on success or exit non-zero with a structured error message on schema violation."
    test_oracle: tests/test_f5_receptionist_subcommands_tier2.py::test_ac1_rechnung_issue_subcommand_emits_gobd_text
  - id: AC-2
    ears: "If the user invokes `python -m kurort_engine dsgvo cascade` with a `guest_id` argument, then the system shall execute the in-house retention cascade via `kurort_engine.kurgaste_retention.auto_cascade.run_cascade(guest_id)`, restrict the cascade to the in-house data inventory (no cross-border subprocessor work), and report the planned retention actions to stdout as a JSON object with at minimum the keys `guest_id`, `actions_planned`, and `actions_count`."
    test_oracle: tests/test_f5_receptionist_subcommands_tier2.py::test_ac2_dsgvo_cascade_subcommand_reports_in_house_actions
  - id: AC-3
    ears: "When the user invokes `python -m kurort_engine predicate file` with a `year` argument (integer) and a `heilbad_code` argument (string), then the system shall dispatch to `kurort_engine.predicate_filing.run(year, heilbad_code)`, persist the predicate artifact to the configured output directory, and emit a success line on stdout containing the year, the heilbad_code, and the persisted artifact path."
    test_oracle: tests/test_f5_receptionist_subcommands_tier2.py::test_ac3_predicate_file_subcommand_persists_artifact

# -----------------------------------------------------------------------------
# not_included — explicit scope boundaries (addresses R1, R3, R4, R5, R6)
# -----------------------------------------------------------------------------
not_included:
  - "PDF library dependency: no reportlab, weasyprint, fpdf, or pypdf added to the project; rechnung subcommand output is text-only per GoBD §10 retention (addresses R1)."
  - "Cross-border DSGVO cascade: dsgvo cascade is strictly in-house data inventory + retention; no subprocessor or third-country transfer work (addresses R4)."
  - "Decimal-as-float JSON payload: JSON payloads MUST use string-quoted decimals (e.g. `\"42.00\"` parseable as `Decimal(\"42.00\")`); raw float is forbidden to avoid IEEE-754 rounding in monetary fields (addresses R5)."
  - "Stdin-only JSON input: the rechnung subcommand MUST support BOTH stdin fallback AND `--input-file <path.json>` for ergonomic operator invocation (addresses R6)."
  - "F8 README module-count drift fix: this spec does NOT touch README; F8 stays superseded at iter-23; if README refresh ships it is a separate cycle (addresses R3)."
  - "Lawyer-budget-dependent work: no DSGVO Art. 28 NIS2-BSIG audit, no P1 avv_console extension; Mix-B safety (STATE-OF-PROJECT = NO Lawyer)."
  - "HHB-API-dependent work: no P3 Loyalty/Stammgast wiring; bound by iter-23 supersession (DEFERRED pending HHB-API or Stammgast-LTV A/B-test trigger)."
  - "Edits to 7 preserved SHAs: the SHIPPED library modules that this spec wires onto MUST remain byte-identical; this spec IMPORTS from them but does NOT MODIFY them (Pattern C chain-extension, not duplication). The 7 preserved SHAs are: (a) `repo/src/kurort_engine/rechnung.py`, (b) `repo/src/kurort_engine/kurgaste_retention/auto_cascade.py`, (c) `repo/src/kurort_engine/predicate_filing/__init__.py`, plus the iter-16 Tier-1 wiring (d) `repo/src/kurort_engine/__main__.py` Tier-1 lines 50-149, (e) `repo/src/kurort_engine/__init__.py:parse_subcommand` Tier-1 dispatcher, (f) `repo/src/kurort_engine/meldeschein.py`, (g) `repo/src/kurort_engine/kurtaxe.py`."
  - "Test framework change: no pytest plugin, no fixture-engine rewrite; the existing `tests/test_f5_receptionist_subcommands.py` subprocess+JSON-stdin convention is reused for the new Tier-2 test file."
  - "Production deployment / Docker / k8s: out of code-module scope."

