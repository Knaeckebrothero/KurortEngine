# -----------------------------------------------------------------------------
# AC-to-EARS-template distribution (per pinned memory protocol)
# -----------------------------------------------------------------------------
ears_template_distribution:
  ubiquitous:         []                                  # none — every AC is event/state-driven
  event_driven:       [AC-1, AC-2, AC-3, AC-4, AC-5, AC-7]  # load / refresh / keydown / token-match / target-size / submit
  state_driven:       [AC-6]                              # above-the-fold visibility in current layout
  unwanted_behavior:  [AC-2, AC-5]                        # silent form-state loss / <44 px target floor
  optional:           []                                  # none