feature: hcmi-scope-12-extension
intent: "Extend the SHIPPED kurort_engine.esg.report ESG disclosure package (iter-27 Q5.1) with SHA HCMI Scope 1 (heating + refrigeration) and Scope 2 (purchased electricity, green-grid branch) calculators, a unified Scope 1+2 convenience method, a Heilbad 2036 Reprädikatisierungs predicate-label ESG narrative generator, and a BFSG-AA export guard that enforces lang=de + accessibility_label metadata + non-affirmation footer + SHA methodology citation — so Hotel Rheinland Bad Orb can publish ESG-readiness positioning for the Heilbad 2036 Reprädikatisierung Vorbereitungszeitraum with date arithmetic + Decimal string-form precision on the SHIPPED 88/88 test baseline, not via lawyer/contractor/vendor work."

acceptance_criteria:
  - id: AC-1
    ears: "Ubiquitous: The system shall expose calculate_scope_1(heating_kwh_annual, refrigeration_kwh_annual) which returns a dict whose keys are heating_tco2e (Toskana heating 0.05 kg CO2e/kWh, re-use of SHIPPED scope1_heating_thermal_spring_emissions), refrigeration_tco2e (HCMI 0.15 kg CO2e/kWh), and total_scope1_tco2e (heating + refrigeration); and the system shall raise ValueError when either argument is < 0; and the module docstring SHALL cite 'Sustainable Hospitality Alliance (SHA) HCMI methodology' as the canonical reference."
    test_oracle: tests/test_hcmi_scope1_2.py::test_ac1_calculate_scope_1_emits_hcmi_scope_1_dict
  - id: AC-2
    ears: "Event-driven: When calculate_scope_2(purchased_electricity_kwh_annual, green_electricity_contract: bool) is called and green_electricity_contract is False, the system shall compute grid_tco2e using DE Strommix 2026 0.42 kg CO2e/kWh; and when green_electricity_contract is True, the system shall compute green_electricity_tco2e using OK Lab certified-green 0.02 kg CO2e/kWh; and the returned dict shall contain both grid_tco2e and green_electricity_tco2e keys plus total_scope2_tco2e; and the system shall raise ValueError when purchased_electricity_kwh_annual < 0."
    test_oracle: tests/test_hcmi_scope1_2.py::test_ac2_calculate_scope_2_green_contract_param_selects_factor
  - id: AC-3
    ears: "Event-driven: When calculate_scope_1_2(heating_kwh_annual, refrigeration_kwh_annual, purchased_electricity_kwh_annual, green_electricity_contract: bool) is called, the system shall return a dict with keys scope1 (verbatim AC-1 result dict), scope2 (verbatim AC-2 result dict), and total_scope1_2_tco2e (sum of AC-1 total + AC-2 total); and the returned dict shall be JSON-serializable via json.dumps(result, default=str)."
    test_oracle: tests/test_hcmi_scope1_2.py::test_ac3_calculate_scope_1_2_emits_unified_hcmi_dict
  - id: AC-4
    ears: "Event-driven: When generate_heilbad_2036_esg_narrative(heating_kwh_annual, refrigeration_kwh_annual, purchased_electricity_kwh_annual, green_electricity_contract: bool) is called, the system shall return a dict whose predicate_label == 'Heilbad Bad Orb (Hessischer Heilbäderverband)' and whose narrative_de (>= 300 chars) and narrative_en (>= 300 chars) both reference the 6 canonical Kurort-vertical anchors (Spessart Bike Tage, R3 Kinzigtal, WaldErfahren, E-Bike charging, Toskana Therme, thermal-spring NiedrigEnergie); and whose representative_period == (date(2036, 1, 1), date(2036, 12, 31)); and whose lang == 'de'; and whose accessibility_label length is >= 20 chars."
    test_oracle: tests/test_hcmi_scope1_2.py::test_ac4_generate_heilbad_2036_esg_narrative_emits_repraedikatisierung_dict
  - id: AC-5
    ears: "Unwanted-behavior: When export_scope1_2_bfsg_aa(disclosure_payload) is called with a payload whose lang is not 'de' or whose accessibility_label is missing or empty, the system shall raise BFSGComplianceError (re-use of SHIPPED iter-21 kurort_engine.kurkarte_wallet.BFSGComplianceError); and when the payload is BFSG-compliant, the system shall return a dict whose compliance_ok == True and whose footer includes the verbatim non-affirmation clause 'This ESG disclosure is voluntary and is provided as ESG-readiness positioning for Bad Orb Heilbad 2036 Reprädikatisierung planning window; it is NOT a regulatory compliance attestation' AND the SHA methodology citation 'Sustainable Hospitality Alliance (SHA) HCMI methodology'; and the returned dict metadata shall include screen-reader text contrast >= 4.5:1."
    test_oracle: tests/test_hcmi_scope1_2.py::test_ac5_export_scope1_2_bfsg_aa_enforces_lang_de_and_non_affirmation_footer

not_included:
  - "NI-1 Real DATEV-EXTF CSV export — pilot scope; bfsg_aa exports JSON only; deferred to iter-31+ Tier-3 once DATEV partner-key is provisioned."
  - "NI-2 Lawyer / Frau Steuerberaterin Müller DSGVO Art. 28 AVV audit — 8 consecutive iterations show NO Lawyer-budget surfaced; voluntary ESG does not require Lawyer review."
  - "NI-3 Live HCMI methodology API connection — published 2025/2026 emission factors are used (DE Strommix, OK Lab certified-green, HCMI heating/food/mobility/linen); live API deferred."
  - "NI-4 Multi-property ESG aggregation — single-entity Hotel Rheinland Bad Orb scope; multi-property deferred to iter-31+ Heilbad 2036 multi-tenant extension."
  - "NI-5 CSRD Omnibus II 2026-Q4 final thresholds — 33-room hotel below CSRD Omnibus I 24.02.2026 thresholds; voluntary ESG is independent of CSRD mandate."
  - "NI-6 Modification of any of the 5 SHIPPED SHAs (kurort_engine.esg.__init__.py, kurort_engine.esg.report.__init__.py, kurort_engine.esg.report.vsme_collector.py, kurort_engine.esg.report.hcmi_scope3_calculator.py, kurort_engine.esg.report.scope1_heating_thermal_spring.py) — anti-drift discipline per iter-28 SHIPPED-foundation verify ritual; only kurort_engine.esg.report.__init__.py re-export additions allowed (Pattern C chain-extension) and __init__.py modification MUST be additive-only (no removal of any existing name)."

done_when:
  - "shasum -a 256 repo/spec/hcmi_scope1_2_extension/spec.yaml returns the SHA-256 recorded in repo/spec/hcmi_scope1_2_extension/spec_lock.md ## Lock metadata table (byte-identical)."
  - "cd repo && PYTHONPATH=src .venv/bin/pytest tests/test_hcmi_scope1_2.py -v --override-ini='addopts=--tb=short' returns 5 passed, 0 failed, 0 skipped, 0 xfail (tests covering AC-1..AC-5 — happy-path + boundary + RED-1..RED-5 forced-flaw assertions)."
  - "cd repo && PYTHONPATH=src .venv/bin/pytest tests/ -q --override-ini='addopts=--tb=line' returns 88 + 5 == 93 passed, 0 failed, 0 regression in the SHIPPED Q5.1 baseline."
  - "cd repo && git diff HEAD~1 HEAD --stat shows 0 lines changed in any of the 5 preserved SHAs (kurort_engine/esg/__init__.py, kurort_engine/esg/report/__init__.py except additive-only re-export, kurort_engine/esg/report/vsme_collector.py, kurort_engine/esg/report/hcmi_scope3_calculator.py, kurort_engine/esg/report/scope1_heating_thermal_spring.py) AND shows 2 new src modules (hcmi_scope1_2_calculator.py + heilbad_predicate_2036_reprädikatisierung.py) AND 1 new test file (test_hcmi_scope1_2.py)."
  - "cd repo && PYTHONPATH=src python -c 'from kurort_engine.esg.report.hcmi_scope1_2_calculator import calculate_scope_1, calculate_scope_2, calculate_scope_1_2; from kurort_engine.esg.report.heilbad_predicate_2036_reprädikatisierung import generate_heilbad_2036_esg_narrative, export_scope1_2_bfsg_aa; r1 = calculate_scope_1_2(10000, 2000, 1000, False); n = generate_heilbad_2036_esg_narrative(10000, 2000, 1000, False); assert n[\"predicate_label\"] == \"Heilbad Bad Orb (Hessischer Heilbäderverband)\" and n[\"lang\"] == \"de\"; print(\"HCMI SCOPE 1+2 EXTENSION SHIPPED: 5/5 SYMBOLS IMPORTABLE + AC-4 PREDICATE LABEL EMITTED\")' exits 0."
  - "python3 -c \"import hashlib, re; spec=open('repo/spec/hcmi_scope1_2_extension/spec.yaml','rb').read(); m=re.search(rb'acceptance_criteria:.*?(?=\\nnot_included:|\\ndone_when:|\\nassumptions:)', spec, re.DOTALL); assert m; lock=open('repo/spec/hcmi_scope1_2_extension/spec_lock.md','rb').read(); idx=lock.find(b'acceptance_criteria:\\n'); end=lock.find(b'\\n```\\n', idx); assert spec[m.start():m.end()] == lock[idx:end], 'PROTECTED block drift: spec.yaml != spec.lock.md'; print('PROTECTED block byte-identity: VERIFIED')\" prints 'PROTECTED block byte-identity: VERIFIED'."
  - "cd repo && .venv/bin/ruff check src/kurort_engine/esg/report/hcmi_scope1_2_calculator.py src/kurort_engine/esg/report/heilbad_predicate_2036_repraedikatisierung.py"

assumptions:
  - "SPEC LOCATION: spec lives at repo/spec/hcmi_scope1_2_extension/spec.yaml (per iter-3 phase-1 SPEC VERIFICATION coverage-map convention for module-scope specs). The workspace-root spec.yaml from prior iterations is the cycle-scope spec; THIS file is the hcmi_scope1_2_extension-package-level spec (Pattern C chain-extension to iter-27 SHIPPED Q5.1)."
  - "Taschenrechner base factors from published 2025/2026 sources (DE Strommix 2026 = 0.42 kg CO2e/kWh; OK Lab certified-green Strom = 0.02 kg CO2e/kWh; HCMI heating thermal-spring = 0.05 kg CO2e/kWh via re-use of SHIPPED scope1_heating_thermal_spring.py; HCMI refrigeration = 0.15 kg CO2e/kWh). The 2 NEW src modules are not connected to any live API (per NI-3)."
  - "6 canonical Kurort-vertical anchors for AC-4 narrative strings are: 'Spessart Bike Tage', 'R3 Kinzigtal', 'WaldErfahren', 'E-Bike charging', 'Toskana Therme', 'thermal-spring NiedrigEnergie' (cross-checked against iter-14 + iter-26 + iter-27 Q5.1 narratives; see iter-30 spec-input synthesis §4 AC-4 spec)."
