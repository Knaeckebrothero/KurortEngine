[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurort-engine"
version = "0.1.0"
description = "kurort_engine MVP - Kurtaxe + Badekur Rechnung + audit for Bad Orb (Hessen KAG)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Developer", email = "developer@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "PyYAML>=6.0",
    # Phase-2 tactical bootstrap: PDF generation for Meldeschein (AC-1 multi-language form)
    # ReportLab chosen over fpdf2 per spec A-3 (most common Python PDF lib, ~5s install, pure-C + Pillow)
    "reportlab>=4.0,<6.0",
]

[project.scripts]
kurort-engine = "kurort_engine.__main__:main"
guest-pwa = "kurort_engine.a11y.guest_pwa.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kurort_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]