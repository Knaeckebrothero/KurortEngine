[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurort-engine"
version = "0.1.0"
description = "kurort_engine MVP - Kurtaxe + Badekur Rechnung + audit for Bad Orb (Hessen KAG)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Developer", email = "developer@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "PyYAML>=6.0",
    # Phase-2 tactical bootstrap: PDF generation for Meldeschein (AC-1 multi-language form)
    # ReportLab chosen over fpdf2 per spec A-3 (most common Python PDF lib, ~5s install, pure-C + Pillow)
    "reportlab>=4.0,<6.0",
]

[project.scripts]
kurort-engine = "kurort_engine.__main__:main"
kurort-app = "kurort_app.cli:main"
guest-pwa = "kurort_engine.a11y.guest_pwa.__main__:main"

[project.optional-dependencies]
# Staff web application (FastAPI + Postgres). The engine itself stays
# dependency-light; the container image installs `.[web]`.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
]
dev = [
    "httpx>=0.27",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kurort_engine", "src/kurort_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are designed to be call defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.Path", "fastapi.File"]