# -----------------------------------------------------------------------------
# intent — one-sentence purpose of the feature
# -----------------------------------------------------------------------------
intent: >-
  Lock the 4 iter-6 confirmed bug fixes (CF-PF-2026-1 adult_rate Decimal
  precision + CF-PF-2026-2 Beglaubigung unquoted-clause extraction +
  CF-PF-2026-3 BFSGComplianceError diagnostic clarity + CF-PF-2026-4
  period/reprdikatisierung_window tuple type-guard) as acceptance criteria
  in `kurort_engine.predicate_filing.2026_{validate,attestation}` so that
  any future regression of these contracts is caught by the existing 4
  pytest repros in `output/repros/001..004_*.py`.

# -----------------------------------------------------------------------------
# acceptance_criteria — 5 EARS-format ACs (Ubiquitous + Event-driven +
# State-driven + Unwanted-behavior mix; regression-lock cycle framing)
# -----------------------------------------------------------------------------
acceptance_criteria:
  - id: AC-1
    ears: >-
      When `_find_adult_rate_eur(bands)` is called with a bands list
      containing an `adult` band whose `rate_eur` or `rate_per_day` field
      is the Decimal-or-float value `2.50`, the function shall return
      the canonical string `"2.50"` (two fractional digits, trailing
      zero preserved); the `adult_rate_applied` field of the attestation
      payload shall equal `"2.50"`, not `"2.5"`. The implementation
      shall use `decimal.Decimal` (e.g. `f"{Decimal(str(rate)):.2f}"`)
      rather than `str(rate)`.
    test_oracle: >-
      output/repros/001_adult_rate_float_precision_loss.py::test_repro_001_adult_rate_float_precision_loss
      output/repros/001_adult_rate_float_precision_loss.py::test_repro_001b_adult_rate_via_yaml_unquoted_path

  - id: AC-2
    ears: >-
      When `extract_2026_satzung_schema(profile)` is called with a
      `beglaubigung_clauses` list whose YAML clauses are in canonical
      Bad Orb 2026 Satzung unquoted-prose form (no surrounding double
      quotes around `clause_text`), the function shall return a non-empty
      list of clauses with one element per `- clause_id:` block; the
      extracted `clause_text` shall equal the prose body verbatim.
    test_oracle: >-
      output/repros/002_beglaubigung_silent_drop_unescaped_clauses.py::test_repro_002a_single_unquoted_german_clause_extracted
      output/repros/002_beglaubigung_silent_drop_unescaped_clauses.py::test_repro_002b_two_unquoted_clauses_extracted

  - id: AC-3
    ears: >-
      When `load_2026_profile(profile_dict)` is called with a profile
      whose `period` or `reprdikatisierung_window` field is a `str` (or
      `None`, or any non-list type), the function shall raise
      `ValueError` (not silently bypass); when the field is a 2-element
      list of strings, the function shall coerce it to a `tuple[str, str]`.
    test_oracle: >-
      output/repros/004_load_2026_profile_period_string_bypass.py::test_repro_004_period_as_string_returns_tuple

  - id: AC-4
    ears: >-
      When `compute_anti_drift_sha()` raises `BFSGComplianceError`
      (anti-drift violation), the error message body shall reference
      ONLY the 4 iter-33 SHIPPED predicate_filing chain-extension modules
      (`predicate_packet_assembler`, `kurgaste_health_data_aggregator`,
      `heilbad_2036_narrative_generator`, `predicate_filing_export`) —
      not the 6 SHIPPED non-predicate_filing SHAs (esg + esg.report +
      kurpaket_orchestrator + kurkarte_wallet + spa_wellness +
      ev_charging), which are protected by separate git-diff discipline.
    test_oracle: >-
      output/repros/003_anti_drift_sha_misleading_diagnostic.py::test_repro_003_diagnostic_lists_only_modules_actually_shaed

  - id: AC-5
    ears: >-
      While the regression-lock cycle is in effect, the full pytest suite
      under `tests/` shall report `132 passed, 0 failed` (or more if new
      tests are added in future cycles); no previously-passing test shall
      fail. The 4 regression-locks in `output/repros/` shall report
      `6 passed, 0 failed` (the 6 tests across the 4 repro files).
    test_oracle: >-
      repo/tests/test_predicate_filing_2026.py (full predicate_filing 2026 suite)
      output/repros/001_adult_rate_float_precision_loss.py
      output/repros/002_beglaubigung_silent_drop_unescaped_clauses.py
      output/repros/003_anti_drift_sha_misleading_diagnostic.py
      output/repros/004_load_2026_profile_period_string_bypass.py

